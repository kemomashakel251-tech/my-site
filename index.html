<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOPA Store</title>
<style>
:root{--main: #ff6600;--main-dark: #e65c00;--green:#25D366;--red:#dc3545;--bg:#f7f8fa;--card:#fff;--text:#1a1a1a;--muted:#666}
*{box-sizing:border-box;font-family:'Cairo', system-ui, Arial;-webkit-tap-highlight-color:transparent}
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700&display=swap');
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:80px;font-size:16px}
header{background:var(--main);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0002}
header h2{font-size:24px;margin:0;font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:20px}
.page{display:none}.page.on{display:block}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--card);padding:14px;border-radius:14px;box-shadow:0 2px 8px #0001;text-align:center;transition:.2s;border:1px solid #eee}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 16px #0002}
.media-container { width:100%; height:200px; position:relative; overflow:hidden; border-radius:10px; background:#f0f0f0; }
.media-container img,.media-container video { width:100%; height:100%; object-fit:cover; display:none; }
.media-container img.active,.media-container video.active { display:block; }
.media-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#fff; border:0; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:10; }
.media-nav.prev { right:5px; }.media-nav.next { left:5px; }
.card h4{margin:12px 0 6px;font-size:16px;font-weight:700}
.price{color:var(--main);font-size:18px;font-weight:700}
.stock{font-size:13px;color:var(--green);font-weight:700;margin-top:4px}
.stock.low{color:var(--red)}
.btn{background:var(--main);color:#fff;border:0;padding:12px 16px;border-radius:10px;cursor:pointer;width:100%;margin-top:8px;font-size:16px;font-weight:700}
.btn:hover{background:var(--main-dark)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:#e9ecef;color:var(--text)}
.btn.small{width:auto;padding:10px 14px;font-size:15px;min-width:44px}
input,textarea,select{width:100%;padding:12px 14px;margin:10px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
.box{background:var(--card);padding:24px;border-radius:16px;margin:20px 0}
#cart{position:fixed;top:80px;left:20px;background:var(--card);padding:20px;border-radius:16px;box-shadow:0 8px 30px #0003;width:380px;display:none;z-index:999;max-height:85vh;overflow:auto}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;display:none;z-index:9999;font-weight:700}
.float{position:fixed;bottom:24px;left:24px;background:var(--green);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-decoration:none;box-shadow:0 4px 16px #0003;z-index:99}
.cart-item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:14px 0}
.cart-item img,.cart-item video{width:60px;height:60px;object-fit:cover;border-radius:10px}
.qty{display:flex;align-items:center;gap:10px}
.check-prod{border:1px solid #eee;border-radius:14px;padding:18px;margin-bottom:16px;background:#fafbfc}
.coupon-box{display:flex;gap:8px;margin:14px 0}
.coupon-box input{flex:1;margin:0}
@media(max-width:768px){.products{grid-template-columns:repeat(2,1fr)}#cart{top:0;left:0;right:0;width:100%}}
@media(max-width:480px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toast"></div>
<a id="waFloat" class="float" target="_blank">💬</a>

<header>
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0">
    <h2 id="sName">JOPA 🔥</h2>
    <button class="btn small gray" onclick="cartToggle()">السلة 🛒 <b id="cNum">0</b></button>
  </div>
</header>

<div class="container">
  <div id="store" class="page on"><div id="grid" class="products">جاري تحميل المنتجات...</div></div>

  <div id="checkout" class="page">
    <div class="box">
      <h3>اتمام الطلب</h3>
      <div id="checkList"></div><hr>
      <h3>بيانات الشحن</h3>
      <input id="cn" placeholder="الاسم">
      <input id="cp" placeholder="الموبايل" inputmode="tel">
      <select id="cg"></select>
      <textarea id="ca" placeholder="العنوان" rows="2"></textarea>
      <div id="cpBox" class="coupon-box" style="display:none">
        <input id="coupon" placeholder="كود الكوبون">
        <button class="btn gray" style="width:auto" onclick="applyCoupon()">تطبيق</button>
      </div>
      <div id="sum"></div>
      <button class="btn green" onclick="finish()">تأكيد الطلب</button>
      <button class="btn gray" onclick="go('store')">الغاء</button>
    </div>
  </div>
</div>

<div id="cart">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h4 style="margin:0">سلة المشتريات</h4>
    <button class="btn small gray" onclick="cartToggle()">X</button>
  </div>
  <div id="cItems">فاضية</div><hr>
  <p style="font-size:16px">العدد: <b id="cNum2">0</b></p>
  <button class="btn" onclick="toCheckout()">اتمام الطلب</button>
</div>

<script>
let SET={}; let PROD=[]; let CART={}; let CHK_OPTS={}; let COUPON=0; let LAST={}; let db;

function toast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function applyTheme(color){document.documentElement.style.setProperty('--main', color);document.documentElement.style.setProperty('--main-dark', color + 'cc');}

function getPrice(p, qty=1){
  let price = p.disc && p.disc < p.v? p.disc : p.v;
  if(p.bulk_on && qty >= p.bulk_qty){price = price * (1 - p.bulk_disc/100);}
  return price;
}

function drawStore(){
  grid.innerHTML='';
  if(PROD.length === 0) {grid.innerHTML = '<p style="text-align:center">لا توجد منتجات حاليا</p>'; return;}
  PROD.forEach((x, prodIdx)=>{
    let priceHtml = x.disc && x.disc < x.v? `<div class="price"><span style="text-decoration:line-through;color:var(--muted);font-size:14px">${x.v}</span> ${x.disc} جنيه</div>` : `<div class="price">${x.v} جنيه</div>`;
    let stockHtml = x.showStock && x.stock>0? `<div class="stock ${x.stock<5?'low':''}"> متبقي ${x.stock} قطعة</div>` : x.showStock && x.stock==0? `<div class="stock low">نفذت الكمية</div>` : '';
    let btnDisabled = x.stock<=0? 'disabled' : '';
    let mediaList = x.media || []; if(mediaList.length === 0) mediaList = [{type:'image', src:'https://via.placeholder.com/200'}];
    let mediaItemsHtml = mediaList.map((m, i) => {let activeClass = i === 0? 'active' : '';return m.type === 'video'? `<video src="${m.src}" class="media-item-${prodIdx} ${activeClass}" controls muted></video>` : `<img src="${m.src}" class="media-item-${prodIdx} ${activeClass}">`;}).join('');
    let navHtml = mediaList.length > 1? `<button class="media-nav prev" onclick="slideMedia(${prodIdx}, -1)">&#10095;</button><button class="media-nav next" onclick="slideMedia(${prodIdx}, 1)">&#10094;</button>` : '';
    grid.innerHTML+=`<div class="card"><div class="media-container" id="mediaCont${prodIdx}">${mediaItemsHtml}${navHtml}</div><h4>${x.n}</h4><p>${x.d.substring(0,40)}...</p>${priceHtml}${stockHtml}<button class="btn" onclick="addC('${x.id}')" ${btnDisabled}>اضف للسلة</button>${x.bulk_on?`<div style="background:#fff3cd;color:#856404;padding:6px;border-radius:8px;font-size:12px;font-weight:700;margin:6px 0">🔥 اشتري ${x.bulk_qty} قطع ووفر ${x.bulk_disc}%</div>`:''}</div>`;
  });
}
function slideMedia(prodIdx, direction) {let container = document.getElementById(`mediaCont${prodIdx}`);let items = container.querySelectorAll(`.media-item-${prodIdx}`);let activeIdx = Array.from(items).findIndex(el => el.classList.contains('active'));items[activeIdx].classList.remove('active');if(items[activeIdx].tagName === 'VIDEO') items[activeIdx].pause();let nextIdx = activeIdx + direction;if(nextIdx >= items.length) nextIdx = 0;if(nextIdx < 0) nextIdx = items.length - 1;items[nextIdx].classList.add('active');}

function addC(id){let p=PROD.find(x=>x.id==id);if(!p)return toast('المنتج مش موجود');if(p.stock<=0)return toast('خلص');let max = p.maxQty || 999;if((CART[id]||0) >= max) return toast(`اقصى عدد من ${p.n} هو ${max} قطعة`);CART[id]=(CART[id]||0)+1;updC();if(SET.skipCart){toCheckout();return;}toast('تمت الاضافة');}
function delC(id){delete CART[id];delete CHK_OPTS[id];updC()}
function chgQty(id,d){let p=PROD.find(x=>x.id==id);if(!p)return delC(id);let newQ=(CART[id]||0)+d;if(newQ<1)return delC(id);let max = p.maxQty || 999;if(newQ > max) return toast(`اقصى عدد من ${p.n} هو ${max} قطعة`);if(newQ>p.stock)return toast(`المخزون المتاح فقط: ${p.stock}`);CART[id]=newQ;CHK_OPTS[id].q=CART[id];updC();}
function updC(){let items=Object.keys(CART).map(id=>({id:id,p:PROD.find(x=>x.id==id),q:CART[id]}));let total=items.reduce((a,b)=>a+b.q,0);cNum.innerText=total;cNum2.innerText=total;cItems.innerHTML=items.map(x=>{let firstMedia = x.p.media && x.p.media[0]? x.p.media[0] : {type:'image', src:'https://via.placeholder.com/200'};let previewTag = firstMedia.type === 'video'? `<video src="${firstMedia.src}" muted></video>` : `<img src="${firstMedia.src}">`;return `<div class="cart-item">${previewTag}<div style="flex:1"><b>${x.p.n}</b><br><span style="color:var(--muted)">${getPrice(x.p, x.q)} جنيه</span></div><div class="qty"><button class="btn small gray" onclick="chgQty('${x.id}',-1)">-</button><b>${x.q}</b><button class="btn small gray" onclick="chgQty('${x.id}',1)">+</button></div><button class="btn small red" onclick="delC('${x.id}')">X</button></div>`}).join('')||`<p style="text-align:center;color:var(--muted)">السلة فارغة</p>`;}
function cartToggle(){cart.style.display=cart.style.display=='block'?'none':'block'}

function toCheckout(){
  if(!Object.keys(CART).length)return alert('السلة فاضية');
  let noteHtml = SET.clientNote? `<div style='background:#e7f1ff;border:1px solid #b3d4fc;padding:12px;text-align:center;font-weight:600;color:#084298;margin-bottom:15px;border-radius:8px'>📢 ${SET.clientNote}</div>` : '';
  let countDownHtml = SET.countDownOn? `<div style='background:#ffcc00;padding:10px;text-align:center;font-weight:bold;color:#000;margin-bottom:15px'>⏰ ${SET.countDownText} ${SET.countDownHours}:${SET.countDownMins}</div>` : '';
  checkList.innerHTML= noteHtml + countDownHtml + Object.keys(CART).map(id=>{
    let p=PROD.find(x=>x.id==id); if(!p) return ''; if(!CHK_OPTS[id])CHK_OPTS[id]={q:CART[id],sizes:{},colors:{}};
    let opt = CHK_OPTS[id]; let totalQty = CART[id]; let price = getPrice(p, totalQty);
    let sizeSum = Object.values(opt.sizes).reduce((a,b)=>a+b,0); let colorSum = Object.values(opt.colors).reduce((a,b)=>a+b,0);
    if(sizeSum==0 && p.sz && p.sz.length) opt.sizes[p.sz[0]] = totalQty; if(colorSum==0 && p.cl && p.cl.length) opt.colors[p.cl[0]] = totalQty;
    let sizeHtml = p.sz && p.sz.length? `<div><b>المقاسات:</b><br>`+ p.sz.map(s=>{let val = opt.sizes[s]||0; return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:50px">${s}:</span><input type="number" min="0" max="${totalQty}" value="${val}" oninput="setDist('${id}','sizes','${s}',this.value)" style="width:70px"></div>`}).join('')+`</div>` : '';
    let colorHtml = p.cl && p.cl.length? `<div><b>الوان:</b><br>`+ p.cl.map(c=>{let val = opt.colors[c]||0; return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:50px">${c}:</span><input type="number" min="0" max="${totalQty}" value="${val}" oninput="setDist('${id}','colors','${c}',this.value)" style="width:70px"></div>`}).join('')+`</div>` : '';
    return `<div class="check-prod"><img src="${p.media && p.media[0]? p.media[0].src : 'https://via.placeholder.com/200'}"><h3>${p.n}</h3><h4>الاجمالي: ${totalQty} قطع</h4>${sizeHtml}${colorHtml}<h3 style="color:var(--main)">السعر: ${price*totalQty} جنيه</h3></div>`
  }).join('');
  cg.innerHTML=`<option value="">اختار المحافظة</option>`+SET.gov.map(g=>`<option value="${g.v}">${g.n} - ${g.v} جنيه</option>`).join('');
  cg.onchange=calc; COUPON=0;coupon.value='';cpBox.style.display=SET.cpOn?'flex':'none';calc();cartToggle();go('checkout')
}
function setDist(id,type,key,val){let opt = CHK_OPTS[id];let totalQty = CART[id];val = +val || 0;opt[type][key] = val;let sum = Object.values(opt[type]).reduce((a,b)=>a+b,0);if(sum > totalQty){toast('المجموع ماينفعش يزيد عن '+totalQty);opt[type][key] = totalQty - (sum - val);}toCheckout();}
function calc(){let sub=0, bulkSave=0;Object.keys(CART).forEach(id=>{let p=PROD.find(x=>x.id==id);if(!p) return;let qty = CART[id];let normalPrice = p.disc && p.disc < p.v? p.disc : p.v;let itemPrice = getPrice(p, qty);let itemTotal = itemPrice * qty;let normalTotal = normalPrice * qty;if(p.bulk_on && qty >= p.bulk_qty){bulkSave += normalTotal - itemTotal;}sub += itemTotal;});let ship=+cg.value||0;let discountAmount = sub * (COUPON / 100);LAST={sub,ship,tot:sub+ship-discountAmount, bulkSave: bulkSave};sum.innerHTML=`<hr><table style="background:transparent"><tr><td>المنتجات</td><td><b>${sub.toFixed(1)}</b></td></tr>${bulkSave>0?`<tr><td style="color:#22c55e">خصم الكمية</td><td style="color:#22c55e"><b>-${bulkSave.toFixed(1)}</b></td></tr>`:''}<tr><td>الشحن</td><td><b>${ship}</b></td></tr>${COUPON>0?`<tr><td>خصم الكوبون</td><td style="color:var(--green)">-%${COUPON} (-${discountAmount.toFixed(1)})</td></tr>`:''}<tr><td><b>الإجمالي</b></td><td><b style="color:var(--main);font-size:20px">${LAST.tot.toFixed(1)} جنيه</b></td></tr></table>`;}
function applyCoupon(){if(coupon.value==SET.cpCode){COUPON=+SET.cpVal;toast(`%${COUPON} تم التطبيق`)}else{COUPON=0;toast('الكود خطأ')};calc()}

async function finish(){
  if(!cn.value) return toast('اكتب الاسم'); if(!cp.value) return toast('اكتب الموبايل'); if(!ca.value) return toast('اكتب العنوان'); if(!cg.value) return toast('اختار المحافظة');
  let items=[];
  for(let id in CART){
    let p=PROD.find(x=>x.id==id); let opt=CHK_OPTS[id]; let price = getPrice(p, CART[id]);
    let sizeSum = Object.values(opt.sizes).reduce((a,b)=>a+b,0); let colorSum = Object.values(opt.colors).reduce((a,b)=>a+b,0);
    if(p.sz && p.sz.length && sizeSum != CART[id]) return toast(`مجموع المقاسات لازم يساوي ${CART[id]} للمنتج ${p.n}`);
    if(p.cl && p.cl.length && colorSum != CART[id]) return toast(`مجموع الالوان لازم يساوي ${CART[id]} للمنتج ${p.n}`);
    items.push({id:id,n:p.n,v:price,q:CART[id],cost:p.cost||0,sizes:opt.sizes,colors:opt.colors});
  }
  let newOrder = {id:Date.now(),date:new Date().toLocaleString('ar-EG'),items,subtotal: LAST.sub,bulkDiscount: LAST.bulkSave || 0,coupon: LAST.sub * (COUPON / 100),ship: LAST.ship,tot:LAST.tot,st:'new',c:{n:cn.value,p:cp.value,a:ca.value,g:cg.options[cg.selectedIndex].text}};
  await saveOrderToCloud(newOrder);
  CART={};CHK_OPTS={};COUPON=0;updC();toast('تم الطلب بنجاح');cn.value=cp.value=ca.value='';go('store')
}

// Firebase
import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js").then(({ initializeApp }) => {
import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js").then(({ getFirestore, collection, addDoc, doc, getDoc, onSnapshot, serverTimestamp }) => {
const app = initializeApp({apiKey: "AIzaSyDW1_AUSDl5vyzH_l5SucrA4CISv2Sz8g",authDomain: "jopa-ff3d4.firebaseapp.com",projectId: "jopa-ff3d4",storageBucket: "jopa-ff3d4.firebasestorage.app",messagingSenderId: "481955111504",appId: "1:481955111504:web:6920b1440453fb2da0e755"});
db = getFirestore(app);
window.saveOrderToCloud = async function(order){await addDoc(collection(db, "orders"), {...order, createdAt: serverTimestamp()});}

// سحب الاعدادات
getDoc(doc(db, "settings", "main")).then(snap => { if(snap.exists()){ SET = snap.data(); applyTheme(SET.theme); sName.innerText=SET.name; waFloat.href=`https://wa.me/${SET.wa}`; }});

// سحب المنتجات لايف
onSnapshot(collection(db, "products"), (snapshot) => {PROD = [];snapshot.forEach((doc) => { PROD.push({id: doc.id,...doc.data()}); });drawStore();});

})});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOPA Store</title>
<style>
:root{
  --main: #ff6600;
  --main-dark: #e65c00;
  --green:#25D366;
  --red:#dc3545;
  --bg:#f7f8fa;
  --card:#fff;
  --text:#1a1a1a;
  --muted:#666
}
*{box-sizing:border-box;font-family:'Cairo', system-ui, Arial;-webkit-tap-highlight-color:transparent}
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700&display=swap');
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:80px;font-size:16px}
header{background:var(--main);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0002}
header h2{font-size:24px;margin:0;font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav a{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:15px;font-weight:600;transition:.2s}
nav a:hover{background:#fff;color:var(--main)}
.container{max-width:1200px;margin:0 auto;padding:20px}
.page{display:none}
.page.on{display:block}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--card);padding:14px;border-radius:14px;box-shadow:0 2px 8px #0001;text-align:center;transition:.2s;border:1px solid #eee;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 16px #0002}

.media-container { width:100%; height:200px; position:relative; overflow:hidden; border-radius:10px; background:#f0f0f0; }
.media-container img, .media-container video { width:100%; height:100%; object-fit:cover; display:none; }
.media-container img.active, .media-container video.active { display:block; }
.media-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#fff; border:0; width:30px; height:30px; border-radius:50%; cursor:pointer; font-weight:bold; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:10; }
.media-nav.prev { right:5px; }
.media-nav.next { left:5px; }

.card h4{margin:12px 0 6px;font-size:16px;font-weight:700}
.card p{color:var(--muted);margin:0 0 10px}
.price{color:var(--main);font-size:18px;font-weight:700}
.stock{font-size:13px;color:var(--green);font-weight:700;margin-top:4px}
.stock.low{color:var(--red)}
.btn{background:var(--main);color:#fff;border:0;padding:12px 16px;border-radius:10px;cursor:pointer;width:100%;margin-top:8px;font-size:16px;font-weight:700;transition:.2s;display:inline-block;text-align:center}
.btn:hover{background:var(--main-dark)}
.btn.green{background:var(--green)}.btn.green:hover{opacity:0.9}.btn.red{background:var(--red)}.btn.red:hover{opacity:0.9}.btn.gray{background:#e9ecef;color:var(--text)}.btn.gray:hover{background:#ddd}
.btn.small{width:auto;padding:10px 14px;font-size:15px;min-width:44px}
.btn:disabled{background:#ccc;cursor:not-allowed}
input,textarea,select{width:100%;padding:12px 14px;margin:10px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--main);outline:0;box-shadow:0 0 0 3px #ff660022}
.box{background:var(--card);padding:24px;border-radius:16px;margin:20px 0;box-shadow:0 2px 12px #0001}
#cart{position:fixed;top:80px;left:20px;background:var(--card);padding:20px;border-radius:16px;box-shadow:0 8px 30px #0003;width:380px;display:none;z-index:999;max-height:85vh;overflow:auto}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;display:none;z-index:9999;font-size:16px;font-weight:700;box-shadow:0 4px 12px #0003}
.float{position:fixed;bottom:24px;left:24px;background:var(--green);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-decoration:none;box-shadow:0 4px 16px #0003;z-index:99;transition:.2s}
.float:hover{transform:scale(1.1)}
.cart-item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:14px 0}
.cart-item img, .cart-item video{width:60px;height:60px;object-fit:cover;border-radius:10px}
.qty{display:flex;align-items:center;gap:10px}
.opt-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;margin:6px;border:2px solid #ddd;border-radius:10px;cursor:pointer;background:#fff;font-size:15px;min-height:44px;font-weight:600;transition:.2s}
.opt-btn:hover{border-color:var(--main)}
.opt-btn.active{background:var(--main);color:#fff;border-color:var(--main)}
.opt-btn.disabled{opacity:.4;pointer-events:none;background:#f5f5f5}
.check-prod{border:1px solid #eee;border-radius:14px;padding:18px;margin-bottom:16px;background:#fafbfc}
.check-prod img, .check-prod video{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:14px}
table{width:100%;background:var(--card);border-radius:12px;border-collapse:collapse;overflow:hidden}
.coupon-box{display:flex;gap:8px;margin:14px 0}
.coupon-box input{flex:1;margin:0}

.dynamic-timer-box { display: flex; justify-content: center; gap: 10px; margin: 15px 0; direction: ltr; }
.timer-segment { background: #333; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 20px; font-weight: 700; min-width: 50px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.timer-label { font-size: 11px; color: #ccc; margin-top: 4px; font-weight: normal; font-family: sans-serif; }

@media(max-width:768px){
.container{padding:12px}
.products{grid-template-columns:repeat(2,1fr);gap:12px}
.media-container{height:160px}
#cart{top:0;left:0;right:0;width:100%;border-radius:0 0 16px 16px;max-height:90vh}
header{padding:12px 16px}
header h2{font-size:20px}
nav a{padding:8px 12px;font-size:14px}
}

@media(max-width:480px){
.products{grid-template-columns:1fr}
}
</style>

  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;

</head>
<body>
<div id="toast"></div>
<a id="waFloat" class="float" target="_blank">💬</a>

<header>
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0">
    <h2 id="sName">JOPA 🔥</h2>
    <nav>
      <button class="btn small gray" onclick="toggleLang()" id="langBtn" style="margin:0; font-size:13px">EN</button>
      <a onclick="go('store')"><span data-key="nav_store">المتجر</span></a>
      <a onclick="cartToggle()"><span data-key="nav_cart">السلة</span> 🛒 <b id="cNum">0</b></a>
    </nav>
  </div>
</header>

<div class="container">
  <div id="store" class="page on">
    <div id="storeCatBar" style="display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px;"></div>
    <div id="grid" class="products">جاري تحميل المنتجات...</div>
  </div>

  <div id="checkout" class="page">
    <div class="box">
      <h3 data-key="checkout_title">اتمام الطلب</h3>
      <div id="checkList"></div>
      <hr>
      <h3 data-key="shipping_info">بيانات الشحن</h3>
      <input id="cn" placeholder="الاسم">
      <input id="cp" placeholder="الموبايل" inputmode="tel">
      <select id="cg"></select>
      <textarea id="ca" placeholder="العنوان" rows="2"></textarea>
      <div id="cpBox" class="coupon-box" style="display:none">
        <input id="coupon" placeholder="كود الكوبون">
        <button class="btn gray" style="width:auto" onclick="applyCoupon()" data-key="apply_btn">تطبيق</button>
      </div>
      <div id="sum"></div>
      <div id="vodafoneBox" style="display:none; background:#fff3cd; border:1px solid #ffe69c; border-radius:12px; padding:16px; margin:14px 0;">
        <h4 style="margin:0 0 8px;color:#856404">💜 الدفع عن طريق فودافون كاش</h4>
        <p style="margin:0 0 10px">حوّل قيمة الطلب على الرقم: <b id="vfNumberDisplay" style="font-size:18px;color:var(--main)"></b></p>
        <label>ارفق صورة (اسكرين شوت) من التحويل</label>
        <input id="vfScreenshot" type="file" accept="image/*">
        <div id="vfPreview" style="margin-top:8px"></div>
      </div>
      <button class="btn green" onclick="finish()" data-key="confirm_order">تأكيد الطلب</button>
      <button class="btn gray" onclick="go('store')" data-key="cancel_btn">الغاء</button>
    </div>
  </div>

  <div id="landingPage" class="page">
    <div class="box" style="max-width:650px; margin:0 auto; padding:15px; border-radius:12px;">
      <button class="btn gray small" onclick="go('store')" style="margin-bottom:15px;">← العودة للمتجر الرئيسية</button>
      
      <div id="landingMedia" style="width:100%; max-height:450px; overflow:hidden; border-radius:12px; background:#fafafa;"></div>
      <h1 id="landingTitle" style="text-align:center; margin:15px 0; font-size:26px;"></h1>
      <div id="landingPrice" style="text-align:center; margin-bottom:15px;"></div>
      
      <div id="lpTimerWrapper" style="display:none; background:#fff3cd; color:#856404; padding:12px; text-align:center; border-radius:8px; font-weight:bold; margin-bottom:20px;">
        <div id="lpTimerText" style="margin-bottom:5px;"></div>
        <div class="dynamic-timer-box">
          <div><div class="timer-segment" id="lpHours">00</div><div class="timer-label">ساعة</div></div>
          <div><div class="timer-segment" id="lpMins">00</div><div class="timer-label">دقيقة</div></div>
          <div><div class="timer-segment" id="lpSecs">00</div><div class="timer-label">ثانية</div></div>
        </div>
      </div>
      
      <div id="landingDesc" style="font-size:18px; line-height:1.8; color:#333; margin-bottom:25px; white-space:pre-line;"></div>
      <hr>
      <button class="btn green" id="landingBuyBtn" style="font-size:20px; padding:15px; position:sticky; bottom:10px; z-index:999; box-shadow:0 4px 15px rgba(0,0,0,0.2);">طلب المنتج الآن والدفع عند الاستلام 🛒</button>
    </div>
  </div>
</div>

<div id="cart">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h4 style="margin:0" data-key="nav_cart">سلة المشتريات</h4>
    <button class="btn small gray" onclick="cartToggle()">X</button>
  </div>
  <div id="cItems">فاضية</div>
  <hr>
  <p style="font-size:16px"><span data-key="count_lbl">العدد</span>: <b id="cNum2">0</b></p>
  <button class="btn" onclick="toCheckout()" data-key="checkout_title">اتمام الطلب</button>
</div>

<script>
let SET={"name":"JOPA Store","wa":"2010","theme":"#ff6600","gov":[{"n":"العاصمة","v":50}],"categories":[{"id":"all","n":"الكل"},{"id":"electronics","n":"إلكترونيات"},{"id":"fashion","n":"أزياء"},{"id":"cosmetics","n":"تجميل"}],"cpOn":false,"cpCode":"SALE50","cpVal":10,"skipCart":false,"clientNote":"","fakeCounterOn":true,"fakeCounterNum":15,"countDownOn":true,"countDownHours":2,"countDownMins":30,"countDownSecs":0,"countDownText":"ينتهي العرض الخاص خلال","fbPixelId":"","tiktokPixelId":"","vodafoneOn":false,"vodafoneNumber":""};
let PROD=[];
let currentFilter = 'all';
let CART={};let LAST={};let CHK_OPTS={};let COUPON=0;
let LANG = localStorage.lang || 'ar';
let timerIntervalGlobal = null;
let db;
let pixelsInitialized = false;
let VF_SCREENSHOT = null;
let visitCounted = false;

const i18n = {
  ar: {
    nav_store: "المتجر", nav_cart: "السلة",
    show_stock_lbl: "اظهار المخزون الكلي للعميل ✓", sizes: "المقاسات", colors: "الالوان",
    checkout_title: "إتمام الطلب", shipping_info: "بيانات الشحن", apply_btn: "تطبيق", confirm_order: "تأكيد الطلب", cancel_btn: "إلغاء", count_lbl: "العدد",
    empty_cart: "السلة فارغة", item_out: "المنتج نفذ", added_cart: "تم الإضافة للسلة", max_stock: "المخزون الكلي المتاح فقط", select_size: "اختار مقاس لـ", select_color: "اختار لون لـ",
    ordered_msg: "تم الطلب بنجاح", currency: "جنيه", pcs: "قطعة",
    placeholder_name: "الاسم بالكامل", placeholder_phone: "رقم الموبايل", placeholder_address: "العنوان بالتفصيل", placeholder_coupon: "كود الكوبون", select_gov: "اختار المحافظة"
  },
  en: {
    nav_store: "Store", nav_cart: "Cart",
    show_stock_lbl: "Show stock to client ✓", sizes: "Sizes", colors: "Colors",
    checkout_title: "Checkout", shipping_info: "Shipping Information", apply_btn: "Apply", confirm_order: "Confirm Order", cancel_btn: "Cancel", count_lbl: "Count",
    empty_cart: "Cart is empty", item_out: "Out of stock", added_cart: "Added to cart", max_stock: "Available stock limit reached", select_size: "Select size for ", select_color: "Select color for ",
    ordered_msg: "Order placed successfully", currency: "EGP", pcs: "Pcs",
    placeholder_name: "Full Name", placeholder_phone: "Mobile Number", placeholder_address: "Detailed Address", placeholder_coupon: "Coupon Code", select_gov: "Select Governorate"
  }
};

function applyTheme(color){
  document.documentElement.style.setProperty('--main', color);
  document.documentElement.style.setProperty('--main-dark', color + 'cc');
}

function updateLangDOM(){
  let h = document.getElementById('htmlTag');
  h.setAttribute('lang', LANG);
  h.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langBtn').innerText = LANG === 'ar' ? 'EN' : 'AR';
  
  document.querySelectorAll('[data-key]').forEach(el => {
    let key = el.getAttribute('data-key');
    if(i18n[LANG][key]) el.innerText = i18n[LANG][key];
  });

  document.getElementById('cn').placeholder = i18n[LANG].placeholder_name;
  document.getElementById('cp').placeholder = i18n[LANG].placeholder_phone;
  document.getElementById('ca').placeholder = i18n[LANG].placeholder_address;
  document.getElementById('coupon').placeholder = i18n[LANG].placeholder_coupon;
}

function toggleLang(){
  LANG = LANG === 'ar' ? 'en' : 'ar';
  localStorage.lang = LANG;
  updateLangDOM();
  if(document.getElementById('store').classList.contains('on')) drawStore();
}

function toast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}

function go(id){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
  if(id=='store')drawStore();
  if(id !== 'landingPage' && id !== 'checkout' && timerIntervalGlobal) { clearInterval(timerIntervalGlobal); }
}

function getPrice(p, qty=1){
  let price = p.disc && p.disc < p.v? p.disc : p.v;
  if(p.bulk_on && qty >= p.bulk_qty){ price = price * (1 - p.bulk_disc/100); }
  return price;
}

function filterCat(catName, btnElement) {
  currentFilter = catName;
  btnElement.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  drawStore();
}

function startDynamicTimer(hoursContainerId, minsContainerId, secsContainerId) {
  if(timerIntervalGlobal) clearInterval(timerIntervalGlobal);
  let configH = parseInt(SET.countDownHours) || 2;
  let configM = parseInt(SET.countDownMins) || 30;
  let configS = parseInt(SET.countDownSecs) || 0;
  let totalConfigSeconds = (configH * 3600) + (configM * 60) + configS;
  let targetTimestamp = localStorage.getItem('jopa_timer_target');
  let now = Math.floor(Date.now() / 1000);

  if (!targetTimestamp || parseInt(targetTimestamp) <= now) {
    targetTimestamp = now + totalConfigSeconds;
    localStorage.setItem('jopa_timer_target', targetTimestamp);
  }

  function updateDOM() {
    let currentNow = Math.floor(Date.now() / 1000);
    let rem = targetTimestamp - currentNow;
    if (rem <= 0) {
      targetTimestamp = currentNow + totalConfigSeconds;
      localStorage.setItem('jopa_timer_target', targetTimestamp);
      rem = totalConfigSeconds;
    }
    let h = Math.floor(rem / 3600);
    let m = Math.floor((rem % 3600) / 60);
    let s = rem % 60;
    let hEl = document.getElementById(hoursContainerId);
    let mEl = document.getElementById(minsContainerId);
    let sEl = document.getElementById(secsContainerId);
    if(hEl) hEl.innerText = String(h).padStart(2, '0');
    if(mEl) mEl.innerText = String(m).padStart(2, '0');
    if(sEl) sEl.innerText = String(s).padStart(2, '0');
  }
  updateDOM();
  timerIntervalGlobal = setInterval(updateDOM, 1000);
}

function renderCategoriesDOM() {
  if(!SET.categories) SET.categories = [{"id":"all","n":"الكل"}];
  let storeBar = document.getElementById('storeCatBar');
  if(storeBar) {
    storeBar.innerHTML = SET.categories.map(c => {
      let activeClass = currentFilter === c.id ? 'active' : '';
      return `<button class="opt-btn ${activeClass}" onclick="filterCat('${c.id}', this)">${c.n}</button>`;
    }).join('');
  }
}

function openLandingPage(id) {
  let p = PROD.find(x => x.id == id);
  if(!p) return;

  window.location.hash = `lp?id=${id}`;

  document.getElementById('landingTitle').innerText = p.n;
  document.getElementById('landingDesc').innerText = p.d || (LANG==='ar' ? 'لا يوجد وصف تفصيلي متوفر حالياً لهذا المنتج.' : 'No description available for this product.');

  let priceHtml = p.disc && p.disc < p.v
    ? `<span style="text-decoration:line-through;color:var(--muted);font-size:18px; margin-left:10px;">${p.v} ${i18n[LANG].currency}</span> <span style="color:var(--main); font-size:26px; font-weight:bold;">${p.disc} ${i18n[LANG].currency}</span>`
    : `<span style="color:var(--main); font-size:26px; font-weight:bold;">${p.v} ${i18n[LANG].currency}</span>`;
  document.getElementById('landingPrice').innerHTML = priceHtml;

  let firstMedia = p.media && p.media[0] ? p.media[0] : {type:'image', src:'https://via.placeholder.com/400'};
  document.getElementById('landingMedia').innerHTML = firstMedia.type === 'video'
    ? `<video src="${firstMedia.src}" controls autoplay muted style="width:100%; height:100%; object-fit:contain;"></video>`
    : `<img src="${firstMedia.src}" style="width:100%; height:100%; object-fit:contain;">`;

  let buyBtn = document.getElementById('landingBuyBtn');
  buyBtn.setAttribute('onclick', `addC('${p.id}');`);

  let timerWrap = document.getElementById('lpTimerWrapper');
  if(SET.countDownOn) {
     timerWrap.style.display = 'block';
     document.getElementById('lpTimerText').innerText = SET.countDownText;
     startDynamicTimer('lpHours', 'lpMins', 'lpSecs');
  } else {
     timerWrap.style.display = 'none';
  }

  go('landingPage');
}

window.addEventListener('hashchange', checkDeepLinks);
function checkDeepLinks() {
  let hash = window.location.hash;
  if(hash.startsWith('#lp?id=')) {
     let id = hash.split('=')[1];
     setTimeout(() => { openLandingPage(id); }, 400);
  }
}

function drawStore(){
  grid.innerHTML='';
  let filtered = PROD.filter(x => currentFilter === 'all' || x.cat === currentFilter);
  if(filtered.length === 0){ grid.innerHTML='<p style="text-align:center;color:var(--muted)">لا توجد منتجات حالياً في هذا القسم</p>'; return; }
  
  filtered.forEach((x, prodIdx)=>{
    let priceHtml = x.disc && x.disc < x.v
      ? `<div class="price"><span style="text-decoration:line-through;color:var(--muted);font-size:14px">${x.v}</span> ${x.disc} ${i18n[LANG].currency}</div>`
      : `<div class="price">${x.v} ${i18n[LANG].currency}</div>`;
    let stockHtml = x.showStock && x.stock>0? `<div class="stock ${x.stock<5?'low':''}"> ${LANG=='ar'?'متبقي':'Remaining'} ${x.stock} ${i18n[LANG].pcs}</div>` : x.showStock && x.stock==0? `<div class="stock low">${LANG=='ar'?'نفذت الكمية':'Out of Stock'}</div>` : '';
    let btnDisabled = x.stock<=0? 'disabled' : '';
    
    let fakeCounterHtml = '';
    if(SET.fakeCounterOn) {
       let fakeBuyers = Math.floor(Math.random() * 12) + 4;
       let fakeStock = Math.floor(Math.random() * parseInt(SET.fakeCounterNum)) + 2;
       fakeCounterHtml = LANG === 'ar' 
         ? `<div style="color:red;font-size:12px;margin-top:5px">🔥 قام ${fakeBuyers} أشخاص بطلب هذا اليوم</div><div style="color:green;font-size:12px">متبقي ${fakeStock} قطع فقط في المخزن!</div>`
         : `<div style="color:red;font-size:12px;margin-top:5px">🔥 ${fakeBuyers} person ordered this today</div><div style="color:green;font-size:12px">Only ${fakeStock} items left in stock!</div>`;
    }

    let mediaList = x.media || [];
    if(mediaList.length === 0) mediaList = [{type:'image', src:'https://via.placeholder.com/200'}];
    
    let mediaItemsHtml = mediaList.map((m, i) => {
      let activeClass = i === 0 ? 'active' : '';
      return m.type === 'video' ? `<video src="${m.src}" class="media-item-${prodIdx} ${activeClass}" controls muted></video>` : `<img src="${m.src}" class="media-item-${prodIdx} ${activeClass}">`;
    }).join('');

    let navHtml = mediaList.length > 1 ? `<button class="media-nav prev" onclick="slideMedia(${prodIdx}, -1)">&#10095;</button><button class="media-nav next" onclick="slideMedia(${prodIdx}, 1)">&#10094;</button>` : '';
    let landingBtnHtml = (x.customLandingUrl && x.customLandingUrl.trim() !== '') ? `<button class="btn gray" style="margin-top:5px; font-size:13px; padding:6px; font-weight:bold; border: 1px solid var(--main);" onclick="window.open('${x.customLandingUrl}', '_blank')">👁️ رابط صفحة الهبوط المخصصة</button>` : '';

    let bulkDiscountTextHtml = x.bulk_on ? (LANG === 'ar' ? `<div style="background:#fff3cd;color:#856404;padding:6px;border-radius:8px;font-size:12px;font-weight:700;margin:6px 0;text-align:center">🔥 اشتري ${x.bulk_qty} قطع ووفر ${x.bulk_disc}%</div>` : `<div style="background:#fff3cd;color:#856404;padding:6px;border-radius:8px;font-size:12px;font-weight:700;margin:6px 0;text-align:center">🔥 Buy ${x.bulk_qty} pieces and save ${x.bulk_disc}%</div>`) : '';

    grid.innerHTML+=`
      <div class="card">
        <div class="media-container" id="mediaCont${prodIdx}">${mediaItemsHtml}${navHtml}</div>
        <h4>${x.n}</h4>
        <p>${x.d ? x.d.substring(0,40) : ''}...</p>
        ${priceHtml}${stockHtml}${fakeCounterHtml}
        <button class="btn" onclick="addC('${x.id}')" ${btnDisabled}>${LANG=='ar'?'اضف للسلة':'Add to Cart'}</button>
        ${landingBtnHtml}${bulkDiscountTextHtml}
      </div>`;
  });
}

function slideMedia(prodIdx, direction) {
  let container = document.getElementById(`mediaCont${prodIdx}`);
  let items = container.querySelectorAll(`.media-item-${prodIdx}`);
  let activeIdx = Array.from(items).findIndex(el => el.classList.contains('active'));
  items[activeIdx].classList.remove('active');
  if(items[activeIdx].tagName === 'VIDEO') items[activeIdx].pause();
  let nextIdx = activeIdx + direction;
  if(nextIdx >= items.length) nextIdx = 0;
  if(nextIdx < 0) nextIdx = items.length - 1;
  items[nextIdx].classList.add('active');
}

function addC(id){
  let p=PROD.find(x=>x.id==id);
  if(!p)return toast('المنتج مش موجود');
  if(p.stock<=0)return toast('خلص');
  let max = p.maxQty || 999;
  if((CART[id]||0) >= max) return toast(`اقصى عدد من ${p.n} هو ${max} قطعة`);
  CART[id]=(CART[id]||0)+1;
  updC();
  if(SET.skipCart){toCheckout();return;}
  toast('تمت الاضافة');
}

function delC(id){delete CART[id];delete CHK_OPTS[id];updC()}

function chgQty(id,d){
  let p=PROD.find(x=>x.id==id);
  if(!p)return delC(id);
  let newQ=(CART[id]||0)+d;
  if(newQ<1)return delC(id);
  let max = p.maxQty || 999;
  if(newQ > max) return toast(`اقصى عدد من ${p.n} هو ${max} قطعة`);
  if(newQ>p.stock)return toast(`${i18n.max_stock}: ${p.stock}`);
  CART[id]=newQ;
  if(CHK_OPTS[id]) CHK_OPTS[id].q=CART[id];
  updC();
}

function updC(){
  let items=Object.keys(CART).map(id=>({id:id,p:PROD.find(x=>x.id==id),q:CART[id]})).filter(x=>x.p);
  let total=items.reduce((a,b)=>a+b.q,0);
  cNum.innerText=total;cNum2.innerText=total;
  cItems.innerHTML=items.map(x=>{
    let firstMedia = x.p.media && x.p.media[0] ? x.p.media[0] : {type:'image', src:'https://via.placeholder.com/200'};
    let previewTag = firstMedia.type === 'video' ? `<video src="${firstMedia.src}" muted></video>` : `<img src="${firstMedia.src}">`;
    return `
    <div class="cart-item">
      ${previewTag}
      <div style="flex:1"><b>${x.p.n}</b><br><span style="color:var(--muted)">${getPrice(x.p, x.q)} ${i18n.currency}</span></div>
      <div class="qty">
        <button class="btn small gray" onclick="chgQty('${x.id}',-1)">-</button>
        <b>${x.q}</b>
        <button class="btn small gray" onclick="chgQty('${x.id}',1)">+</button>
      </div>
      <button class="btn small red" onclick="delC('${x.id}')">X</button>
    </div>`}).join('')||`<p style="text-align:center;color:var(--muted)">${i18n[LANG].empty_cart}</p>`;
}

function cartToggle(){cart.style.display=cart.style.display=='block'?'none':'block'}

// دالة مضافة للتحكم في عدد القطع مباشرة من شاشة الدفع
window.updateCheckoutQty = function(id, d) {
    let p = PROD.find(x => x.id == id);
    if(!p) return;
    let newQ = (CART[id] || 0) + d;
    if (newQ < 1) {
        if(confirm('هل تريد حذف المنتج من السلة؟')) {
            delC(id);
            if(Object.keys(CART).length === 0) return go('store');
            return toCheckout();
        }
        return;
    }
    let max = p.maxQty || 999;
    if (newQ > max) return toast(`اقصى عدد من ${p.n} هو ${max} قطعة`);
    if (newQ > p.stock) return toast(`المخزون الكلي المتاح فقط: ${p.stock}`);
    CART[id] = newQ;
    if(CHK_OPTS[id]) CHK_OPTS[id].q = newQ;
    updC();
    toCheckout(); 
}

function toCheckout(){
  if(!Object.keys(CART).length)return alert('السلة فاضية');
  let noteHtml = SET.clientNote? `<div style='background:#e7f1ff;border:1px solid #b3d4fc;padding:12px;text-align:center;font-weight:600;color:#084298;margin-bottom:15px;border-radius:8px'>📢 ${SET.clientNote}</div>` : '';
  
  let countDownHtml = '';
  if(SET.countDownOn) {
     countDownHtml = `<div style='background:#fff3cd; color:#856404; padding:12px; text-align:center; font-weight:bold; margin-bottom:15px; border-radius:8px;'>
        <div style="margin-bottom:5px;">⏰ ${SET.countDownText}</div>
        <div class="dynamic-timer-box">
          <div><div class="timer-segment" id="chkHours">00</div><div class="timer-label">ساعة</div></div>
          <div><div class="timer-segment" id="chkMins">00</div><div class="timer-label">دقيقة</div></div>
          <div><div class="timer-segment" id="chkSecs">00</div><div class="timer-label">ثانية</div></div>
        </div>
     </div>`;
  }

  checkList.innerHTML= noteHtml + countDownHtml + Object.keys(CART).map(id=>{
    let p=PROD.find(x=>x.id==id); if(!p) return '';
    if(!CHK_OPTS[id])CHK_OPTS[id]={q:CART[id],sizes:{},colors:{}};
    let opt = CHK_OPTS[id]; let totalQty = CART[id]; let price = getPrice(p, totalQty);

    let sizeSum = Object.values(opt.sizes).reduce((a,b)=>a+b,0);
    let colorSum = Object.values(opt.colors).reduce((a,b)=>a+b,0);
    if(sizeSum==0 && p.sz && p.sz.length) opt.sizes[p.sz[0]] = totalQty;
    if(colorSum==0 && p.cl && p.cl.length) opt.colors[p.cl[0]] = totalQty;
    sizeSum = Object.values(opt.sizes).reduce((a,b)=>a+b,0);
    colorSum = Object.values(opt.colors).reduce((a,b)=>a+b,0);

    let sizeHtml = p.sz && p.sz.length? `<div id="sizes-${id}" style="margin-top:10px;"><b>المقاسات:</b><br>`+ p.sz.map(s=>{
      let val = opt.sizes[s]||0; let isDisabled = (sizeSum >= totalQty) && val == 0; let bg = isDisabled ? '#e9ecef' : '#fff';
      return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span>${s}:</span><input type="number" min="0" max="${totalQty}" value="${val}" ${isDisabled?'disabled':''} style="width:70px;padding:6px;background-color:${bg};" oninput="setDist('${id}','sizes','${s}',this.value)"></div>`
    }).join('')+`</div>` : '';

    let colorHtml = p.cl && p.cl.length? `<div id="colors-${id}" style="margin-top:10px;"><b>الألوان:</b><br>`+ p.cl.map(c=>{
      let val = opt.colors[c]||0; let isDisabled = (colorSum >= totalQty) && val == 0; let bg = isDisabled ? '#e9ecef' : '#fff';
      return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span>${c}:</span><input type="number" min="0" max="${totalQty}" value="${val}" ${isDisabled?'disabled':''} style="width:70px;padding:6px;background-color:${bg};" oninput="setDist('${id}','colors','${c}',this.value)"></div>`
    }).join('')+`</div>` : '';

    let descriptionHtml = p.d ? `<p style="color:var(--muted); font-size:14px; margin: 8px 0; white-space: pre-line;">${p.d}</p>` : '';

    return `<div class="check-prod" id="chk${id}">
      <div style="display:flex; gap:12px; align-items:center;">
        <img src="${p.media && p.media[0]? p.media[0].src : 'https://via.placeholder.com/200'}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">
        <div>
          <h3 style="margin:0 0 4px 0;">${p.n}</h3>
          <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
            <h4 style="margin:0; color:var(--muted)">الكمية:</h4>
            <button class="btn small gray" style="margin:0; padding:4px 10px;" onclick="updateCheckoutQty('${id}', -1)">-</button>
            <b style="font-size:18px;">${totalQty}</b>
            <button class="btn small gray" style="margin:0; padding:4px 10px;" onclick="updateCheckoutQty('${id}', 1)">+</button>
          </div>
        </div>
      </div>
      ${descriptionHtml}
      ${sizeHtml}
      ${colorHtml}
      <h3 style="color:var(--main); margin-top:12px;">السعر: ${price*totalQty} جنيه</h3>
    </div>`
  }).join('');

  cg.innerHTML=`<option value="">اختار المحافظة</option>`+SET.gov.map(g=>`<option value="${g.v}">${g.n} - ${g.v} جنيه</option>`).join('');
  cg.onchange=calc; COUPON=0;coupon.value='';cpBox.style.display=SET.cpOn?'flex':'none';calc();

  VF_SCREENSHOT = null;
  let vfBox = document.getElementById('vodafoneBox');
  if(SET.vodafoneOn && SET.vodafoneNumber){
    vfBox.style.display='block';
    document.getElementById('vfNumberDisplay').innerText = SET.vodafoneNumber;
    document.getElementById('vfPreview').innerHTML='';
    document.getElementById('vfScreenshot').value='';
  } else {
    vfBox.style.display='none';
  }

  if(!document.getElementById('checkout').classList.contains('on')){
    if(cart.style.display=='block') cartToggle();
    go('checkout');
  }
  if(SET.countDownOn) { startDynamicTimer('chkHours', 'chkMins', 'chkSecs'); }
}

document.getElementById('vfScreenshot').addEventListener('change', function(e){
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(ev){
    let img = new Image();
    img.onload = function(){
      let canvas = document.createElement('canvas');
      let max_size = 900;
      let width = img.width, height = img.height;
      if(width > height){ if(width > max_size){ height *= max_size/width; width = max_size; } }
      else { if(height > max_size){ width *= max_size/height; height = max_size; } }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      VF_SCREENSHOT = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('vfPreview').innerHTML = `<img src="${VF_SCREENSHOT}" style="width:100px;height:100px;object-fit:cover;border-radius:8px">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function setDist(id,type,key,val){
  let opt = CHK_OPTS[id]; let totalQty = CART[id]; val = +val || 0; opt[type][key] = val;
  let sum = Object.values(opt[type]).reduce((a,b)=>a+b,0);
  
  if(sum > totalQty){ 
      toast('المجموع ماينفعش يزيد عن '+totalQty); 
      opt[type][key] = totalQty - (sum - val); 
      val = opt[type][key];
      sum = totalQty;
      let currentInput = document.querySelector(`#${type}-${id} input[oninput*="'${key}'"]`);
      if(currentInput) currentInput.value = val;
  }
  
  let container = document.getElementById(type + '-' + id);
  if(container) {
      container.querySelectorAll('input').forEach(input => {
        let inputVal = +input.value || 0;
        if (sum >= totalQty && inputVal === 0) {
          input.disabled = true;
          input.style.backgroundColor = "#e9ecef";
        } else {
          input.disabled = false;
          input.style.backgroundColor = "#fff";
        }
      });
  }
  calc();
}

function calc(){
  let sub=0, bulkSave=0;
  Object.keys(CART).forEach(id=>{
    let p=PROD.find(x=>x.id==id); if(!p) return;
    let qty = CART[id]; let normalPrice = p.disc && p.disc < p.v? p.disc : p.v; let itemPrice = getPrice(p, qty); let itemTotal = itemPrice * qty; let normalTotal = normalPrice * qty;
    if(p.bulk_on && qty >= p.bulk_qty){ bulkSave += normalTotal - itemTotal; }
    sub += itemTotal;
  });
  let ship=+cg.value||0; let discountAmount = sub * (COUPON / 100);
  LAST={sub,ship,tot:sub+ship-discountAmount, bulkSave: bulkSave}; 
  sum.innerHTML=`<hr><table style="background:transparent;width:100%">
    <tr><td>المنتجات</td><td><b>${sub.toFixed(1)}</b></td></tr>
    ${bulkSave>0?`<tr><td style="color:#22c55e">خصم الكمية</td><td style="color:#22c55e"><b>-${bulkSave.toFixed(1)}</b></td></tr>`:''}
    <tr><td>الشحن</td><td><b>${ship}</b></td></tr>
    ${COUPON>0?`<tr><td>خصم الكوبون</td><td style="color:var(--green)">-%${COUPON} (-${discountAmount.toFixed(1)})</td></tr>`:''}
    <tr><td><b>الإجمالي</b></td><td><b style="color:var(--main);font-size:20px">${LAST.tot.toFixed(1)} جنيه</b></td></tr></table>`;
}

function applyCoupon(){if(coupon.value==SET.cpCode){COUPON=+SET.cpVal;toast(`%${COUPON} OK`)}else{COUPON=0;toast('Error')};calc()}

async function finish(){
  if(!cn.value) return toast('من فضلك اكتب الاسم'); if(!cp.value) return toast('من فضلك اكتب الموبايل'); if(!ca.value) return toast('من فضلك اكتب العنوان'); if(!cg.value) return toast('من فضلك اختار المحافظة');
  if(SET.vodafoneOn && SET.vodafoneNumber && !VF_SCREENSHOT) return toast('من فضلك ارفق صورة اسكرين شوت التحويل');
  let items=[];
  for(let id in CART){
    let p=PROD.find(x=>x.id==id); let opt=CHK_OPTS[id]; let price = getPrice(p, CART[id]);
    let sizeSum = Object.values(opt.sizes).reduce((a,b)=>a+b,0); let colorSum = Object.values(opt.colors).reduce((a,b)=>a+b,0);
    if(p.sz && p.sz.length && sizeSum!= CART[id]) return toast(`مجموع المقاسات لازم يساوي ${CART[id]} للمنتج ${p.n}`);
    if(p.cl && p.cl.length && colorSum!= CART[id]) return toast(`مجموع الالوان لازم يساوي ${CART[id]} للمنتج ${p.n}`);
    if(CART[id]>p.stock)return toast(`${i18n.max_stock} ${p.stock}`);
    items.push({id:id,n:p.n,d:p.d||'',v:price,q:CART[id],cost:p.cost||0,sizes:opt.sizes,colors:opt.colors});
    
    p.stock-=CART[id];
    for(let c in opt.colors){ if(p.stockByColor && p.stockByColor[c]) p.stockByColor[c] -= opt.colors[c]; }
    for(let s in opt.sizes){ if(p.stockBySize && p.stockBySize[s]) p.stockBySize[s] -= opt.sizes[s]; }
    await setDoc(doc(db, "products", id), p);
  }

  let newOrder = { id:Date.now(),date:new Date().toLocaleString('ar-EG'),items,subtotal: LAST.sub,bulkDiscount: LAST.bulkSave || 0,coupon: LAST.sub * (COUPON / 100),ship: LAST.ship,tot:LAST.tot,st:'new',c:{n:cn.value,p:cp.value,a:ca.value,g:cg.options[cg.selectedIndex].text}};
  if(SET.vodafoneOn && VF_SCREENSHOT){ newOrder.paymentMethod='vodafone'; newOrder.paymentScreenshot=VF_SCREENSHOT; }
  if(typeof fbq !== 'undefined' && SET.fbPixelId) { fbq('track', 'Purchase', { value: LAST.tot, currency: 'EGP' }); }
  if(typeof TMTK !== 'undefined' && SET.tiktokPixelId) { TMTK.push(['track', 'CompletePayment', { value: LAST.tot, currency: 'EGP' }]); }

  await saveOrderToCloud(newOrder);
  CART={};CHK_OPTS={};COUPON=0;VF_SCREENSHOT=null;updC();toast('تم الطلب بنجاح ');cn.value=cp.value=ca.value='';
  window.location.hash = ""; go('store');
}

db = getFirestore(app);

window.setDoc = setDoc; window.doc = doc;

// Live settings fetch
onSnapshot(doc(db, "settings", "main"), (snap) => {

     SET = snap.data();
     applyTheme(SET.theme);
     sName.innerText=SET.name || 'JOPA 🔥';

     if(!pixelsInitialized){

     }

// عداد زيارات المتجر - يزيد مرة واحدة لكل تحميل للصفحة
if(!visitCounted){
  visitCounted = true;
  setDoc(doc(db, "settings", "stats"), { visits: increment(1) }, { merge: true }).catch(()=>{});
}

// Live products fetch
onSnapshot(collection(db, "products"), (snapshot) => {PROD = [];snapshot.forEach((doc) => { PROD.push({id: doc.id,...doc.data()}); });drawStore(); updC(); checkDeepLinks();});

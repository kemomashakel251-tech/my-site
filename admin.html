<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم — مكتب أفق العدالة</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ background: var(--parchment); }
  .admin-header{
    background: var(--ink); color:var(--paper);
    padding-block:18px; position:sticky; top:0; z-index:40;
    border-bottom:1px solid var(--line);
  }
  .admin-header .container{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .admin-header h1{ color:var(--paper); font-size:1.2rem; margin:0; }
  .admin-wrap{ max-width:960px; margin-inline:auto; padding: 34px 20px 90px; }
  .login-box{
    max-width:420px; margin: 90px auto; background:var(--paper);
    border:1px solid rgba(18,58,44,.12); border-radius:var(--radius);
    padding:36px; text-align:center;
  }
  .login-box .seal{ width:64px; margin-inline:auto; margin-bottom:14px; }
  .login-box h2{ margin-bottom:6px; }
  .login-box p.hint{ color:#6B7A73; font-size:.88rem; margin-bottom:24px; }
  .login-box .field{ text-align:right; }

  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; position:sticky; top:78px; z-index:30; background:var(--parchment); padding-block:6px; }
  .admin-tab-btn{
    border:1px solid rgba(18,58,44,.15); background:var(--paper); color:var(--ink-text);
    padding:9px 16px; border-radius:999px; font-size:.85rem; font-weight:700; cursor:pointer;
  }
  .admin-tab-btn.active{ background:var(--emerald); color:#fff; border-color:var(--emerald); }
  .admin-panel{ display:none; }
  .admin-panel.active{ display:block; }

  .admin-section{
    background:var(--paper); border:1px solid rgba(18,58,44,.12);
    border-radius:var(--radius); padding:26px; margin-bottom:22px;
  }
  .admin-section h2{ font-size:1.1rem; display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .admin-section h2 .badge{
    font-family:var(--sans); font-size:.68rem; font-weight:700;
    color:var(--gold); border:1px solid var(--line); border-radius:999px;
    padding:3px 10px;
  }
  .admin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; }
  @media (max-width:700px){ .admin-grid{ grid-template-columns:1fr; } }
  .admin-grid .field.full{ grid-column:1/-1; }
  .save-row{ display:flex; align-items:center; gap:14px; margin-top:16px; }
  .save-status{ font-size:.85rem; color:#6B7A73; }
  .save-status.ok{ color:#1E5240; }
  .save-status.err{ color:#9A2E2E; }

  .repeater-list{ margin-bottom:12px; }
  .repeater-item{
    border:1px solid rgba(18,58,44,.12); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; background:#FFFDF8; position:relative;
  }
  .repeater-item .admin-grid{ margin-inline-end:0; }
  .repeater-item .field label{ font-size:.78rem; margin-bottom:5px; }
  .repeater-item .field input, .repeater-item .field textarea{ padding:9px 11px; font-size:.88rem; }
  .repeater-item .field textarea{ min-height:64px; }
  .repeater-tools{ display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
  .icon-btn{
    background:none; border:1px solid rgba(18,58,44,.2); color:var(--emerald);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:.9rem; line-height:1;
  }
  .icon-btn:hover{ background:rgba(18,58,44,.08); }
  .icon-btn.danger{ border-color:rgba(154,46,46,.3); color:#9A2E2E; }
  .icon-btn.danger:hover{ background:#9A2E2E; color:#fff; }
  .add-item-btn{
    background:none; border:1.5px dashed var(--gold); color:var(--emerald);
    padding:10px 16px; border-radius:var(--radius); font-weight:700; font-size:.85rem;
    cursor:pointer; width:100%;
  }
  .add-item-btn:hover{ background:rgba(201,162,39,.08); }
  .empty-hint{ color:#8a9490; font-size:.9rem; text-align:center; padding:24px 0; }

  .messages-list{ display:flex; flex-direction:column; gap:12px; }
  .message-card{
    border:1px solid rgba(18,58,44,.12); border-radius:var(--radius);
    padding:16px; background:#FFFDF8;
  }
  .message-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .message-head b{ font-size:1rem; color:var(--emerald); }
  .message-date{ font-size:.75rem; color:#8a9490; }
  .message-meta{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:10px; font-size:.85rem; }
  .message-meta a{ color:var(--emerald); font-weight:600; }
  .message-subject{
    background:rgba(201,162,39,.12); color:var(--emerald);
    padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700;
  }
  .message-body{ font-size:.9rem; color:#3E4A44; white-space:pre-wrap; margin-bottom:10px; }

  #app-loading{ text-align:center; padding:100px 20px; color:#6B7A73; }
  .hidden{ display:none !important; }
  .save-all-bar{
    position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
    margin-inline:-20px; margin-top:20px;
  }
</style>
</head>
<body>

<div id="app-loading">جارٍ التحقق من الدخول...</div>

<!-- ===================== شاشة تسجيل الدخول ===================== -->
<div id="login-screen" class="hidden">
  <div class="container">
    <div class="login-box">
      <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="50" r="46" stroke-width="1.5"/>
        <circle class="ring" cx="50" cy="50" r="38" stroke-width="1"/>
        <path d="M50 30 L50 62 M38 40 L50 30 L62 40 M32 46 h12 M56 46 h12 M34 46 l-4 12 h16 l-4 -12 M58 46 l-4 12 h16 l-4 -12" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>لوحة تحكم المكتب</h2>
      <p class="hint">سجّل الدخول ببيانات الأدمن اللي أنشأتها في Firebase Authentication</p>
      <form id="login-form">
        <div class="field">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center">دخول</button>
        <div id="login-msg" class="form-msg" role="status"></div>
      </form>
    </div>
  </div>
</div>

<!-- ===================== لوحة التحكم ===================== -->
<div id="dashboard" class="hidden">
  <header class="admin-header">
    <div class="container">
      <h1>لوحة تحكم موقع مكتب أفق العدالة</h1>
      <div style="display:flex; align-items:center; gap:14px">
        <a href="index.html" target="_blank" class="btn btn-ghost" style="padding:8px 16px; font-size:.85rem">عرض الموقع ↗</a>
        <button id="logout-btn" class="btn btn-gold" style="padding:8px 16px; font-size:.85rem">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="tabs" id="admin-tabs"></div>
    <div id="admin-panels"></div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script src="admin.js" defer></script>
</body>
</html>
